[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit_retry_scheduler"
version = "1.0.0"
description = "Bandit-Optimized Payment Retry Scheduler Prototype"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "policies*", "simulator*", "evaluation*", "runner*", "core*", "audit*"]
