[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit_retry_scheduler"
version = "1.0.0"
description = "Bandit-Optimized Payment Retry Scheduler Prototype"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools]
packages = [
    "bandit_retry_scheduler",
    "bandit_retry_scheduler.api",
    "bandit_retry_scheduler.policies",
    "bandit_retry_scheduler.simulator",
    "bandit_retry_scheduler.evaluation",
    "bandit_retry_scheduler.runner",
    "bandit_retry_scheduler.core",
    "bandit_retry_scheduler.audit",
]

[tool.setuptools.package-dir]
bandit_retry_scheduler = "."
"bandit_retry_scheduler.api" = "api"
"bandit_retry_scheduler.policies" = "policies"
"bandit_retry_scheduler.simulator" = "simulator"
"bandit_retry_scheduler.evaluation" = "evaluation"
"bandit_retry_scheduler.runner" = "runner"
"bandit_retry_scheduler.core" = "core"
"bandit_retry_scheduler.audit" = "audit"
